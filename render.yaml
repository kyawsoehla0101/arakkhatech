services:
  - type: web
    name: arakkhatech
    env: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py tailwind build
    startCommand: gunicorn arakkhatech.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: arakkhatech-db
          property: connectionString

databases:
  - name: arakkhatech-db
    plan: starter
